version: '3.8'

services:
  meeto:
    build: .
    container_name: meeto
    # Port not exposed publicly — cloudflared proxies inbound traffic
    expose:
      - "7432"
    volumes:
      - ./data:/app/data
    env_file:
      - ./data/.env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=7432
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7432/auth/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      meeto:
        condition: service_healthy
    networks:
      - default

networks:
  default:
    name: meeto_net
