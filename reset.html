<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetintel — Reset Password</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1c1c1a; --surface: #242422; --border: rgba(255,255,255,0.12); --text: #ebebea; --text2: #9a9a95; --blue: #3b82f6; --blue-bg: rgba(59,130,246,0.15); --danger: #f87171; --ok: #4ade80; }
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f8f8f7; --surface: #ffffff; --border: rgba(0,0,0,0.12); --text: #1a1a18; --text2: #6b6b67; --blue: #2563eb; --blue-bg: #dbeafe; --danger: #dc2626; --ok: #16a34a; }
}
body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; justify-content: center; }
.logo-icon { font-size: 28px; }
.logo-name { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; }
h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; text-align: center; }
.subtitle { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 28px; line-height: 1.5; }
label { font-size: 12px; font-weight: 600; color: var(--text2); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
input[type=password], input[type=email] {
  width: 100%; padding: 11px 13px; font-size: 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-family: inherit; margin-bottom: 16px; outline: none; transition: border-color 0.15s;
}
input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }
.btn { width: 100%; padding: 12px; background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.msg { font-size: 13px; text-align: center; margin-top: 16px; padding: 10px; border-radius: 8px; display: none; }
.msg.ok { background: rgba(74,222,128,0.12); color: var(--ok); display: block; }
.msg.err { background: rgba(248,113,113,0.12); color: var(--danger); display: block; }
.back { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--blue); text-decoration: none; }
.back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card" id="requestCard">
  <div class="logo">
    <span class="logo-icon">☄️</span>
    <span class="logo-name">Meetintel</span>
  </div>
  <h2>Forgot your password?</h2>
  <p class="subtitle">Enter your email and we'll send you a reset link.</p>
  <label for="forgotEmail">Email</label>
  <input type="email" id="forgotEmail" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')doForgot()" />
  <button class="btn" id="forgotBtn" onclick="doForgot()">Send reset link</button>
  <div class="msg" id="forgotMsg"></div>
  <a class="back" href="/">← Back to sign in</a>
</div>

<div class="card" id="resetCard" style="display:none">
  <div class="logo">
    <span class="logo-icon">☄️</span>
    <span class="logo-name">Meetintel</span>
  </div>
  <h2>Set a new password</h2>
  <p class="subtitle">Choose a strong password for your account.</p>
  <label for="newPwd">New password</label>
  <input type="password" id="newPwd" placeholder="At least 6 characters" autocomplete="new-password" onkeydown="if(event.key==='Enter')document.getElementById('confirmPwd').focus()" />
  <label for="confirmPwd">Confirm password</label>
  <input type="password" id="confirmPwd" placeholder="Re-enter password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doReset()" />
  <button class="btn" id="resetBtn" onclick="doReset()">Set new password</button>
  <div class="msg" id="resetMsg"></div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
if (token) {
  document.getElementById('requestCard').style.display = 'none';
  document.getElementById('resetCard').style.display = '';
}

async function doForgot() {
  const email = document.getElementById('forgotEmail').value.trim();
  const btn = document.getElementById('forgotBtn');
  const msg = document.getElementById('forgotMsg');
  if (!email) return;
  btn.disabled = true; btn.textContent = 'Sending…';
  msg.className = 'msg';
  await fetch('/auth/forgot', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email })
  });
  msg.textContent = 'If that email is registered, a reset link has been sent. Check your inbox.';
  msg.className = 'msg ok';
  btn.disabled = false; btn.textContent = 'Send reset link';
}

async function doReset() {
  const password = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const btn = document.getElementById('resetBtn');
  const msg = document.getElementById('resetMsg');
  msg.className = 'msg';
  if (password.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'msg err'; return; }
  if (password !== confirm) { msg.textContent = "Passwords don't match."; msg.className = 'msg err'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  const r = await fetch('/auth/reset-password', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ token, password })
  }).then(r => r.json()).catch(() => ({ error: 'Network error' }));
  if (r.ok) {
    msg.textContent = 'Password updated! Redirecting to sign in…';
    msg.className = 'msg ok';
    setTimeout(() => window.location.href = '/', 2000);
  } else {
    msg.textContent = r.error || 'Something went wrong. The link may have expired.';
    msg.className = 'msg err';
    btn.disabled = false; btn.textContent = 'Set new password';
  }
}
</script>
</body>
</html>
