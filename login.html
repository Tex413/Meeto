<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetintel — Sign in</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  background: #0d1117;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* Ambient glow background */
body::before {
  content: '';
  position: fixed;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 500px;
  background: radial-gradient(ellipse at center, rgba(59,130,246,0.12) 0%, transparent 65%);
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  bottom: -10%;
  right: -10%;
  width: 500px;
  height: 500px;
  background: radial-gradient(ellipse at center, rgba(139,92,246,0.07) 0%, transparent 60%);
  pointer-events: none;
}

/* Card */
.card {
  background: rgba(19,22,31,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(59,130,246,0.08);
  position: relative;
  z-index: 1;
  backdrop-filter: blur(16px);
}

/* Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
  justify-content: center;
}
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 20px rgba(59,130,246,0.45), 0 0 40px rgba(59,130,246,0.15);
}
.logo-name {
  font-size: 22px; font-weight: 800;
  color: #e8eaf0; letter-spacing: -0.03em;
}

/* Tabs */
.tab-row {
  display: flex;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  margin-bottom: 28px;
  padding: 3px;
  gap: 3px;
}
.tab {
  flex: 1; padding: 8px;
  font-size: 13px; font-weight: 600;
  background: none; border: none;
  border-radius: 8px;
  cursor: pointer; color: rgba(255,255,255,0.4);
  font-family: inherit;
  transition: background 0.2s, color 0.2s;
}
.tab.active {
  background: rgba(59,130,246,0.2);
  color: #60a5fa;
}
.tab:not(.active):hover { color: rgba(255,255,255,0.7); }

/* Headings */
h2 {
  font-size: 17px; font-weight: 700;
  color: #e8eaf0; margin-bottom: 5px;
  text-align: center; letter-spacing: -0.02em;
}
.subtitle {
  font-size: 13px; color: rgba(255,255,255,0.4);
  text-align: center; margin-bottom: 26px;
  line-height: 1.5;
}

/* Form */
label {
  font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,0.35);
  display: block; margin-bottom: 5px;
  text-transform: uppercase; letter-spacing: 0.06em;
}

input[type=password], input[type=text], input[type=email] {
  width: 100%; padding: 11px 13px; font-size: 14px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #e8eaf0;
  font-family: inherit; margin-bottom: 16px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
input:focus {
  border-color: rgba(59,130,246,0.5);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  background: rgba(59,130,246,0.06);
}
input::placeholder { color: rgba(255,255,255,0.2); }

/* Submit button */
.btn {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: #fff; font-size: 14px; font-weight: 700;
  border: none; border-radius: 9px;
  cursor: pointer; font-family: inherit;
  transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(59,130,246,0.35);
}
.btn:hover { opacity: 0.9; box-shadow: 0 6px 28px rgba(59,130,246,0.45); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

/* Error */
.error {
  color: #f87171; font-size: 12px;
  margin-top: -10px; margin-bottom: 14px;
  display: none; font-weight: 500;
}

/* Footer hint */
.hint {
  font-size: 11px; color: rgba(255,255,255,0.25);
  text-align: center; margin-top: 20px; line-height: 1.6;
}
.hint a { color: #60a5fa; text-decoration: none; }
.hint a:hover { color: #93c5fd; }

/* Decorative ring */
.glow-ring {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 520px; height: 520px;
  border: 1px solid rgba(59,130,246,0.06);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
.glow-ring:nth-child(2) {
  width: 700px; height: 700px;
  border-color: rgba(59,130,246,0.03);
}
</style>
</head>
<body>
<div class="glow-ring"></div>
<div class="glow-ring"></div>

<div class="card">
  <div class="logo">
    <span class="logo-icon">☄️</span>
    <span class="logo-name">Meetintel</span>
  </div>

  <div class="tab-row">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Sign in</button>
    <button class="tab" id="tabSignup" onclick="switchTab('signup')">Create account</button>
  </div>

  <!-- Login -->
  <div id="loginView">
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your Meetintel account.</p>
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('loginPwd').focus()" />
    <label for="loginPwd">Password</label>
    <input type="password" id="loginPwd" placeholder="Your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
    <p class="error" id="loginErr">Incorrect email or password.</p>
    <button class="btn" onclick="doLogin()" id="loginBtn">Sign in</button>
    <p class="hint"><a href="/reset">Forgot password?</a> &nbsp;·&nbsp; <a href="/landing" target="_blank">Learn about Meetintel</a></p>
  </div>

  <!-- Sign up -->
  <div id="signupView" style="display:none">
    <h2>Start your free trial</h2>
    <p class="subtitle">20 minutes free — no credit card required.</p>
    <label for="signupEmail">Email</label>
    <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('signupPwd').focus()" />
    <label for="signupPwd">Password</label>
    <input type="password" id="signupPwd" placeholder="At least 6 characters" autocomplete="new-password" onkeydown="if(event.key==='Enter')document.getElementById('signupConfirm').focus()" />
    <label for="signupConfirm">Confirm password</label>
    <input type="password" id="signupConfirm" placeholder="Re-enter password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doSignup()" />
    <p class="error" id="signupErr">Passwords don't match.</p>
    <button class="btn" onclick="doSignup()" id="signupBtn">Create account &amp; start trial</button>
    <p class="hint">By signing up you agree to our <a href="/landing" target="_blank">terms</a>.</p>
  </div>
</div>

<script>
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginView').style.display = isLogin ? '' : 'none';
  document.getElementById('signupView').style.display = isLogin ? 'none' : '';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabSignup').classList.toggle('active', !isLogin);
  document.getElementById(isLogin ? 'loginEmail' : 'signupEmail').focus();
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPwd').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  const r = await fetch('/auth/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email, password })
  }).then(r => r.json()).catch(() => ({ error: 'Network error' }));
  if (r.ok) {
    window.location.href = '/';
  } else {
    err.textContent = r.error || 'Incorrect email or password.';
    err.style.display = '';
    btn.disabled = false; btn.textContent = 'Sign in';
    document.getElementById('loginPwd').value = '';
    document.getElementById('loginPwd').focus();
  }
}

async function doSignup() {
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPwd').value;
  const confirm = document.getElementById('signupConfirm').value;
  const btn = document.getElementById('signupBtn');
  const err = document.getElementById('signupErr');
  err.style.display = 'none';
  if (!email || !email.includes('@')) { err.textContent = 'Enter a valid email address.'; err.style.display = ''; return; }
  if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.style.display = ''; return; }
  if (password !== confirm) { err.textContent = "Passwords don't match."; err.style.display = ''; return; }
  btn.disabled = true; btn.textContent = 'Creating account…';
  const r = await fetch('/auth/register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email, password })
  }).then(r => r.json()).catch(() => ({ error: 'Network error' }));
  if (r.ok) {
    window.location.href = '/';
  } else {
    err.textContent = r.error || 'Registration failed.';
    err.style.display = '';
    btn.disabled = false; btn.textContent = 'Create account & start trial';
  }
}
</script>
</body>
</html>
