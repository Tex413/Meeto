<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeto</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1c1c1a; --surface: #242422; --border: rgba(255,255,255,0.12); --text: #ebebea; --text2: #9a9a95; --blue: #3b82f6; --blue-bg: rgba(59,130,246,0.15); --danger: #f87171; }
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f8f8f7; --surface: #ffffff; --border: rgba(0,0,0,0.12); --text: #1a1a18; --text2: #6b6b67; --blue: #2563eb; --blue-bg: #dbeafe; --danger: #dc2626; }
}
body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; justify-content: center; }
.logo-icon { font-size: 28px; }
.logo-name { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; }
h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; text-align: center; }
.subtitle { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 28px; line-height: 1.5; }
label { font-size: 12px; font-weight: 600; color: var(--text2); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
input[type=password], input[type=text], input[type=email] {
  width: 100%; padding: 11px 13px; font-size: 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-family: inherit; margin-bottom: 16px; outline: none; transition: border-color 0.15s;
}
input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }
.btn { width: 100%; padding: 12px; background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; transition: opacity 0.15s, transform 0.1s; }
.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error { color: var(--danger); font-size: 12px; margin-top: -10px; margin-bottom: 14px; display: none; }
.hint { font-size: 11px; color: var(--text2); text-align: center; margin-top: 18px; line-height: 1.6; }
.hint a { color: var(--blue); text-decoration: none; cursor: pointer; }
.tab-row { display: flex; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; overflow: hidden; }
.tab { flex: 1; padding: 9px; font-size: 13px; font-weight: 600; background: none; border: none; cursor: pointer; color: var(--text2); font-family: inherit; transition: background 0.15s, color 0.15s; }
.tab.active { background: var(--blue); color: #fff; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">☄️</span>
    <span class="logo-name">Meeto</span>
  </div>

  <div class="tab-row">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Sign in</button>
    <button class="tab" id="tabSignup" onclick="switchTab('signup')">Create account</button>
  </div>

  <!-- Login -->
  <div id="loginView">
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your Meeto account.</p>
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('loginPwd').focus()" />
    <label for="loginPwd">Password</label>
    <input type="password" id="loginPwd" placeholder="Your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
    <p class="error" id="loginErr">Incorrect email or password.</p>
    <button class="btn" onclick="doLogin()" id="loginBtn">Sign in</button>
    <p class="hint"><a href="/landing" target="_blank">Learn about Meeto</a></p>
  </div>

  <!-- Sign up -->
  <div id="signupView" style="display:none">
    <h2>Start your free trial</h2>
    <p class="subtitle">20 minutes free — no credit card required.</p>
    <label for="signupEmail">Email</label>
    <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('signupPwd').focus()" />
    <label for="signupPwd">Password</label>
    <input type="password" id="signupPwd" placeholder="At least 6 characters" autocomplete="new-password" onkeydown="if(event.key==='Enter')document.getElementById('signupConfirm').focus()" />
    <label for="signupConfirm">Confirm password</label>
    <input type="password" id="signupConfirm" placeholder="Re-enter password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doSignup()" />
    <p class="error" id="signupErr">Passwords don't match.</p>
    <button class="btn" onclick="doSignup()" id="signupBtn">Create account &amp; start trial</button>
    <p class="hint">By signing up you agree to our <a href="/landing" target="_blank">terms</a>. We'll keep your email for product updates.</p>
  </div>
</div>

<script>
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginView').style.display = isLogin ? '' : 'none';
  document.getElementById('signupView').style.display = isLogin ? 'none' : '';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabSignup').classList.toggle('active', !isLogin);
  document.getElementById(isLogin ? 'loginEmail' : 'signupEmail').focus();
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPwd').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  const r = await fetch('/auth/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email, password })
  }).then(r => r.json()).catch(() => ({ error: 'Network error' }));
  if (r.ok) {
    window.location.href = '/';
  } else {
    err.textContent = r.error || 'Incorrect email or password.';
    err.style.display = '';
    btn.disabled = false; btn.textContent = 'Sign in';
    document.getElementById('loginPwd').value = '';
    document.getElementById('loginPwd').focus();
  }
}

async function doSignup() {
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPwd').value;
  const confirm = document.getElementById('signupConfirm').value;
  const btn = document.getElementById('signupBtn');
  const err = document.getElementById('signupErr');
  err.style.display = 'none';
  if (!email || !email.includes('@')) { err.textContent = 'Enter a valid email address.'; err.style.display = ''; return; }
  if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.style.display = ''; return; }
  if (password !== confirm) { err.textContent = "Passwords don't match."; err.style.display = ''; return; }
  btn.disabled = true; btn.textContent = 'Creating account…';
  const r = await fetch('/auth/register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email, password })
  }).then(r => r.json()).catch(() => ({ error: 'Network error' }));
  if (r.ok) {
    window.location.href = '/';
  } else {
    err.textContent = r.error || 'Registration failed.';
    err.style.display = '';
    btn.disabled = false; btn.textContent = 'Create account & start trial';
  }
}
</script>
</body>
</html>
